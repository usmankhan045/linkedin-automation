<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --accent: #F97316;
    --bg: #0D1117;
    --text: #FFFFFF;
    --text-secondary: #94A3B8;
  }

  body {
    width: 1080px;
    height: 1350px;
    background: var(--bg);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    overflow: hidden;
  }

  .card {
    width: 1080px;
    height: 1350px;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
    padding: 70px 80px 150px;
  }

  /* Decorative background circle — top-right */
  .deco-bg {
    position: absolute;
    top: -120px;
    right: -120px;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle at center, rgba(249, 115, 22, 0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Category badge */
  .badge {
    display: inline-block;
    background: var(--accent);
    color: #0D1117;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 12px 32px;
    border-radius: 9999px;
    align-self: center;
    margin-bottom: 44px;
    white-space: nowrap;
    position: relative;
    z-index: 1;
  }

  /* Headline */
  .headline {
    color: var(--text);
    font-size: clamp(52px, 6vw, 72px);
    font-weight: 700;
    text-align: center;
    line-height: 1.1;
    margin-bottom: 36px;
    word-break: break-word;
    position: relative;
    z-index: 1;
  }

  /* Orange divider */
  .divider {
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
    margin-bottom: 36px;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  /* Bullet list */
  .bullets {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 48px;
    min-height: 0;
    position: relative;
    z-index: 1;
  }

  .bullet {
    display: flex;
    align-items: flex-start;
    gap: 24px;
    border-left: 4px solid var(--accent);
    padding-left: 20px;
    margin-bottom: 16px;
  }

  .bullet-num {
    color: var(--accent);
    font-size: 48px;
    font-weight: 700;
    line-height: 1;
    min-width: 72px;
    flex-shrink: 0;
    padding-top: 2px;
  }

  .bullet-text {
    color: var(--text);
    font-size: 28px;
    font-weight: 400;
    line-height: 1.4;
    padding-top: 6px;
  }

  /* Footer — absolute, always at bottom */
  .footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 24px 80px 44px;
    text-align: center;
    border-top: 1px solid rgba(148, 163, 184, 0.18);
    z-index: 1;
  }

  .footer-name {
    color: var(--text);
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .footer-title {
    color: var(--text-secondary);
    font-size: 22px;
    font-weight: 400;
  }
</style>
</head>
<body>
<div class="card">

  <div class="deco-bg"></div>

  <div class="badge">{{CATEGORY_LABEL}}</div>

  <h1 class="headline">{{HEADLINE}}</h1>

  <div class="divider"></div>

  <div class="bullets">
    <div class="bullet">
      <span class="bullet-num">01</span>
      <span class="bullet-text">{{BULLET_1}}</span>
    </div>
    <div class="bullet">
      <span class="bullet-num">02</span>
      <span class="bullet-text">{{BULLET_2}}</span>
    </div>
    <div class="bullet">
      <span class="bullet-num">03</span>
      <span class="bullet-text">{{BULLET_3}}</span>
    </div>
    <div class="bullet" style="{{BULLET_4_STYLE}}">
      <span class="bullet-num">04</span>
      <span class="bullet-text">{{BULLET_4}}</span>
    </div>
    <div class="bullet" style="{{BULLET_5_STYLE}}">
      <span class="bullet-num">05</span>
      <span class="bullet-text">{{BULLET_5}}</span>
    </div>
  </div>

  <div class="footer">
    <div class="footer-name">Muhammad Usman · Post #{{POST_NUMBER}}</div>
    <div class="footer-title">AI Automation Engineer</div>
  </div>

</div>
</body>
</html>
