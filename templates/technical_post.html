<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=1080">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Suppress any third-party watermarks */
    [class*="gemini"], [class*="watermark"], [id*="watermark"],
    [class*="attribution"], iframe { display: none !important; }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: #05070F;
    }

    /* ── Canvas ─────────────────────────────────────────────────────────────── */
    .canvas {
      width: 1080px;
      height: 1350px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 12% 18%, rgba(249, 115, 22, 0.18) 0%, transparent 45%),
        radial-gradient(ellipse at 88% 82%, rgba(59, 130, 246, 0.16) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 50%, rgba(249, 115, 22, 0.05) 0%, transparent 55%),
        #05070F;
    }

    /* Subtle grid overlay */
    .canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 54px 54px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Corner accents ─────────────────────────────────────────────────────── */
    /* Top-right — orange L */
    .corner-tr {
      position: absolute;
      top: 36px;
      right: 36px;
      width: 44px;
      height: 44px;
      border-top: 2px solid #F97316;
      border-right: 2px solid #F97316;
      z-index: 3;
    }
    /* Bottom-left — blue L */
    .corner-bl {
      position: absolute;
      bottom: 80px;
      left: 36px;
      width: 44px;
      height: 44px;
      border-bottom: 2px solid #3B82F6;
      border-left: 2px solid #3B82F6;
      z-index: 3;
    }

    /* ── Bottom gradient bar ─────────────────────────────────────────────────── */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        #F97316 30%,
        rgba(249,115,22,0.35) 70%,
        transparent 100%
      );
      z-index: 4;
    }

    /* ── Main layout ─────────────────────────────────────────────────────────── */
    .content-area {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 44px 0 56px;
    }

    /* ── Top: category tag ───────────────────────────────────────────────────── */
    .category-tag-row {
      display: flex;
      align-items: center;
      gap: 0;
      width: 860px;
    }

    .category-tag {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: #F97316;
      background: rgba(249, 115, 22, 0.08);
      border: 1px solid rgba(249, 115, 22, 0.30);
      padding: 5px 14px;
      border-radius: 3px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .tag-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(
        to right,
        rgba(249, 115, 22, 0.35),
        transparent
      );
      margin-left: 16px;
    }

    /* ── Middle block ────────────────────────────────────────────────────────── */
    .middle {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 0;
      margin-top: 60px;
    }

    /* Hook — the dominant visual element */
    .hook {
      font-family: 'Syne', sans-serif;
      font-size: 74px;
      font-weight: 800;
      color: #FFFFFF;
      text-align: center;
      line-height: 1.08;
      letter-spacing: -0.01em;
      padding: 0 64px;
      margin-bottom: 24px;
    }

    /* Subheading */
    .subheading {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 26px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.60);
      text-align: center;
      line-height: 1.45;
      padding: 0 100px;
      margin-bottom: 36px;
    }

    /* Orange-glow divider */
    .divider {
      width: 760px;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(249,115,22,0.20) 20%,
        #F97316 50%,
        rgba(249,115,22,0.20) 80%,
        transparent 100%
      );
      position: relative;
      margin-bottom: 40px;
    }
    .divider::after {
      content: '';
      position: absolute;
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 7px;
      background: radial-gradient(ellipse, rgba(249,115,22,0.55) 0%, transparent 100%);
      filter: blur(4px);
    }

    /* ── Bullets ─────────────────────────────────────────────────────────────── */
    .bullets {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 860px;
    }

    .bullet {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      width: 100%;
    }

    .bullet-num {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: #F97316;
      letter-spacing: 0.05em;
      min-width: 30px;
      flex-shrink: 0;
    }

    .tick-left {
      width: 28px;
      height: 1px;
      background: linear-gradient(to right, rgba(249,115,22,0.60), rgba(249,115,22,0.20));
      margin: 0 12px 0 10px;
      flex-shrink: 0;
    }

    .bullet-text {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 27px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.92);
      text-align: center;
      line-height: 1.35;
      flex: 1;
    }

    .tick-right {
      width: 28px;
      height: 1px;
      background: linear-gradient(to left, rgba(249,115,22,0.60), rgba(249,115,22,0.20));
      margin: 0 10px 0 12px;
      flex-shrink: 0;
    }

    /* ── Footer ──────────────────────────────────────────────────────────────── */
    .footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .footer-name {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.02em;
    }

    .footer-title {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.40);
      letter-spacing: 0.04em;
    }

    .footer-postnum {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: rgba(249, 115, 22, 0.55);
      letter-spacing: 0.12em;
      margin-top: 2px;
    }
  </style>
</head>
<body>
<div class="canvas">

  <!-- Corner accents -->
  <div class="corner-tr"></div>
  <div class="corner-bl"></div>

  <!-- Bottom bar -->
  <div class="bottom-bar"></div>

  <!-- Main content -->
  <div class="content-area">

    <!-- Top: category tag with extending line -->
    <div class="category-tag-row">
      <span class="category-tag">{{CATEGORY_LABEL}}</span>
      <div class="tag-line"></div>
    </div>

    <!-- Middle: hook → subheading → divider → bullets -->
    <div class="middle">
      <div class="hook">{{HOOK}}</div>

      <div class="subheading">{{HEADLINE}}</div>

      <div class="divider"></div>

      <div class="bullets">

        <div class="bullet">
          <span class="bullet-num">01</span>
          <div class="tick-left"></div>
          <span class="bullet-text">{{BULLET_1}}</span>
          <div class="tick-right"></div>
        </div>

        <div class="bullet">
          <span class="bullet-num">02</span>
          <div class="tick-left"></div>
          <span class="bullet-text">{{BULLET_2}}</span>
          <div class="tick-right"></div>
        </div>

        <div class="bullet">
          <span class="bullet-num">03</span>
          <div class="tick-left"></div>
          <span class="bullet-text">{{BULLET_3}}</span>
          <div class="tick-right"></div>
        </div>

        <div class="bullet" style="{{BULLET_4_STYLE}}">
          <span class="bullet-num">04</span>
          <div class="tick-left"></div>
          <span class="bullet-text">{{BULLET_4}}</span>
          <div class="tick-right"></div>
        </div>

        <div class="bullet" style="{{BULLET_5_STYLE}}">
          <span class="bullet-num">05</span>
          <div class="tick-left"></div>
          <span class="bullet-text">{{BULLET_5}}</span>
          <div class="tick-right"></div>
        </div>

      </div>
    </div>

    <!-- Bottom: name / title / post number -->
    <div class="footer">
      <div class="footer-name">Muhammad Usman</div>
      <div class="footer-title">AI Automation Engineer</div>
      <div class="footer-postnum">POST #{{POST_NUMBER}}</div>
    </div>

  </div>

</div>
</body>
</html>
