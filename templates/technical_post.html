<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=1080">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    [class*="gemini"], [class*="watermark"], [id*="watermark"],
    [class*="attribution"], iframe { display: none !important; }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
    }

    .canvas {
      width: 1080px;
      height: 1350px;
      position: relative;
      background: linear-gradient(150deg, #F4F8FF 0%, #EBF2FF 45%, #F1F6FF 100%);
      display: flex;
      flex-direction: column;
      padding: 56px 72px 52px;
    }

    /* ── Corner brackets ─────────────────────────────────────────── */
    .corner-tr {
      position: absolute;
      top: 36px;
      right: 36px;
      width: 52px;
      height: 52px;
      border-top: 3px solid #0A7CFF;
      border-right: 3px solid #0A7CFF;
    }

    .corner-bl {
      position: absolute;
      bottom: 36px;
      left: 36px;
      width: 52px;
      height: 52px;
      border-bottom: 3px solid #0A7CFF;
      border-left: 3px solid #0A7CFF;
    }

    /* ── Top badge ───────────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #FFFFFF;
      border: 1.5px solid #C8DAEA;
      border-radius: 10px;
      padding: 10px 20px 10px 14px;
      margin-bottom: 52px;
      box-shadow: 0 2px 10px rgba(10, 37, 64, 0.06);
      flex-shrink: 0;
    }

    .badge-icon {
      width: 22px;
      height: 22px;
      color: #0A7CFF;
      flex-shrink: 0;
    }

    .badge-label {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #0A7CFF;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    /* ── Title block ─────────────────────────────────────────────── */
    .title-block {
      text-align: center;
      flex-shrink: 0;
    }

    .hook-line {
      font-family: 'Inter', sans-serif;
      font-size: 88px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    #hookWord1 { color: #0A7CFF; }
    #hookWord2 { color: #0A2540; }

    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 24px;
      font-weight: 400;
      color: #8FA5BE;
      text-align: center;
      margin-top: 14px;
      letter-spacing: 0.02em;
    }

    .subtitle-accent {
      width: 44px;
      height: 3px;
      background: #0A7CFF;
      border-radius: 2px;
      margin: 12px auto 0;
    }

    /* ── Divider ─────────────────────────────────────────────────── */
    .divider {
      width: 100%;
      height: 1px;
      background: rgba(10, 37, 64, 0.10);
      margin: 44px 0 36px;
      flex-shrink: 0;
    }

    /* ── Bullets ─────────────────────────────────────────────────── */
    .bullets {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .bullet {
      display: flex;
      align-items: center;
      padding: 24px 0;
      border-bottom: 1px dashed rgba(10, 37, 64, 0.16);
    }

    .bullet:first-child {
      border-top: 1px dashed rgba(10, 37, 64, 0.16);
    }

    .bullet-num {
      font-family: 'Inter', sans-serif;
      font-size: 17px;
      font-weight: 800;
      color: #0A2540;
      min-width: 44px;
      flex-shrink: 0;
      letter-spacing: 0.04em;
    }

    .bullet-connector {
      width: 22px;
      height: 0;
      border-top: 2px dashed rgba(10, 37, 64, 0.22);
      margin-right: 16px;
      flex-shrink: 0;
    }

    .bullet-text {
      flex: 1;
      font-family: 'Inter', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #0A2540;
      line-height: 1.3;
    }

    .bullet-tail {
      display: flex;
      align-items: center;
      margin-left: 12px;
      flex-shrink: 0;
    }

    .tail-line {
      width: 36px;
      height: 2px;
      background: #0A7CFF;
      opacity: 0.55;
    }

    .tail-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #0A7CFF;
      flex-shrink: 0;
    }

    /* ── Footer ──────────────────────────────────────────────────── */
    .footer {
      margin-top: 36px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-shrink: 0;
    }

    .avatar {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
    }

    .footer-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .footer-name {
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #0A2540;
    }

    .footer-title {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: #8FA5BE;
    }

    .footer-postnum {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 2px;
    }

    .post-dash {
      width: 20px;
      height: 2px;
      background: #0A7CFF;
      border-radius: 1px;
    }

    .post-text {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #0A7CFF;
    }
  </style>
</head>
<body>
<div class="canvas">

  <div class="corner-tr"></div>
  <div class="corner-bl"></div>

  <!-- Badge -->
  <div>
    <div class="badge">
      <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span class="badge-label">{{CATEGORY_LABEL}}</span>
    </div>
  </div>

  <!-- Title: first word blue, rest dark -->
  <div class="title-block">
    <div class="hook-line">
      <span id="hookWord1"></span><span id="hookWord2"></span>
    </div>
    <div class="subtitle">{{HEADLINE}}</div>
    <div class="subtitle-accent"></div>
  </div>

  <!-- Hidden hook source for JS split -->
  <div id="hookData" style="display:none">{{HOOK}}</div>

  <!-- Divider -->
  <div class="divider"></div>

  <!-- Bullets -->
  <div class="bullets">

    <div class="bullet">
      <span class="bullet-num">01</span>
      <div class="bullet-connector"></div>
      <span class="bullet-text">{{BULLET_1}}</span>
      <div class="bullet-tail"><div class="tail-line"></div><div class="tail-dot"></div></div>
    </div>

    <div class="bullet">
      <span class="bullet-num">02</span>
      <div class="bullet-connector"></div>
      <span class="bullet-text">{{BULLET_2}}</span>
      <div class="bullet-tail"><div class="tail-line"></div><div class="tail-dot"></div></div>
    </div>

    <div class="bullet">
      <span class="bullet-num">03</span>
      <div class="bullet-connector"></div>
      <span class="bullet-text">{{BULLET_3}}</span>
      <div class="bullet-tail"><div class="tail-line"></div><div class="tail-dot"></div></div>
    </div>

    <div class="bullet" style="{{BULLET_4_STYLE}}">
      <span class="bullet-num">04</span>
      <div class="bullet-connector"></div>
      <span class="bullet-text">{{BULLET_4}}</span>
      <div class="bullet-tail"><div class="tail-line"></div><div class="tail-dot"></div></div>
    </div>

    <div class="bullet" style="{{BULLET_5_STYLE}}">
      <span class="bullet-num">05</span>
      <div class="bullet-connector"></div>
      <span class="bullet-text">{{BULLET_5}}</span>
      <div class="bullet-tail"><div class="tail-line"></div><div class="tail-dot"></div></div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <svg class="avatar" viewBox="0 0 54 54" fill="none">
      <circle cx="27" cy="19" r="10" fill="#B4C8DC"/>
      <path d="M5 50C5 37 49 37 49 50" fill="#B4C8DC"/>
      <circle cx="39" cy="26" r="6" fill="#C8DAEC"/>
      <path d="M33 50C33 43 45 43 45 50" fill="#C8DAEC"/>
    </svg>
    <div class="footer-info">
      <div class="footer-name">Muhammad Usman</div>
      <div class="footer-title">{{TITLE}}</div>
      <div class="footer-postnum">
        <div class="post-dash"></div>
        <span class="post-text">Post #{{POST_NUMBER}}</span>
        <div class="post-dash"></div>
      </div>
    </div>
  </div>

</div>
<script>
  var hook = document.getElementById('hookData').textContent.trim();
  var spaceIdx = hook.indexOf(' ');
  if (spaceIdx === -1) {
    document.getElementById('hookWord1').textContent = hook;
  } else {
    document.getElementById('hookWord1').textContent = hook.slice(0, spaceIdx);
    document.getElementById('hookWord2').textContent = ' ' + hook.slice(spaceIdx + 1);
  }
</script>
</body>
</html>
