<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=1080">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Block any external attribution marks */
    [class*="gemini"],
    [class*="watermark"],
    [id*="watermark"],
    [class*="logo"]:not(.our-logo),
    iframe,
    [class*="attribution"] {
      display: none !important;
    }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
    }

    /* ── Engineer Theme: Midnight Mesh Gradient ── */
    .canvas {
      width: 1080px;
      height: 1350px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 15% 88%, rgba(59, 130, 246, 0.20) 0%, transparent 52%),
        radial-gradient(ellipse at 82% 12%, rgba(139, 92, 246, 0.16) 0%, transparent 48%),
        radial-gradient(ellipse at 52% 48%, rgba(16, 50, 120, 0.10) 0%, transparent 60%),
        linear-gradient(158deg, #060714 0%, #0a1628 28%, #07101e 58%, #090714 100%);
    }

    /* Spotlight — top-right 3D depth glow */
    .canvas::before {
      content: '';
      position: absolute;
      top: -90px;
      right: -90px;
      width: 660px;
      height: 660px;
      background: radial-gradient(circle, rgba(130, 185, 255, 0.10) 0%, transparent 62%);
      pointer-events: none;
      z-index: 0;
    }

    /* Secondary ambient glow — bottom-left */
    .canvas::after {
      content: '';
      position: absolute;
      bottom: 50px;
      left: -50px;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(240, 165, 0, 0.07) 0%, transparent 62%);
      pointer-events: none;
      z-index: 0;
    }

    /* Main content area */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* ── Hanging card ── */
    .card-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding-top: 40px;
    }

    .string {
      width: 2px;
      height: 90px;
      background: linear-gradient(to bottom, rgba(180, 200, 230, 0.65), rgba(180, 200, 230, 0.15));
      border-radius: 2px;
      position: absolute;
      top: 0;
      z-index: 3;
    }
    .string-left  { left: 200px; }
    .string-right { right: 200px; }

    .pin {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #7ab3f7, #1565C0);
      box-shadow: 0 0 10px rgba(100, 160, 255, 0.55);
      position: absolute;
      top: 81px;
      z-index: 4;
    }
    .pin-left  { left: 191px; }
    .pin-right { right: 191px; }

    /* Glassmorphism card — Engineer */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      width: 780px;
      padding: 36px 50px 40px;
      border-radius: 16px;
      text-align: center;
      position: relative;
      margin-top: 40px;
    }

    .daily-post-badge {
      display: inline-block;
      background: rgba(240, 165, 0, 0.12);
      border: 1px solid rgba(240, 165, 0, 0.32);
      color: #F0A500;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 6px 24px;
      border-radius: 50px;
      margin-bottom: 16px;
    }

    .category-text {
      font-family: 'Lexend', sans-serif;
      font-size: 98px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 0.04em;
      line-height: 0.88;
    }

    .card-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 400;
      color: rgba(200, 220, 255, 0.55);
      margin-top: 10px;
    }

    /* ── Headline ── */
    .headline {
      font-family: 'Lexend', sans-serif;
      font-size: 60px;
      font-weight: 800;
      color: #FFFFFF;
      text-align: center;
      padding: 36px 80px 0;
      line-height: 1.15;
      position: relative;
      z-index: 1;
    }

    /* ── Bullets ── */
    .bullets {
      width: 100%;
      padding: 0 70px;
      margin-top: 38px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }

    .bullet {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 24px;
      width: auto;
      max-width: 100%;
    }

    .num {
      font-family: 'Lexend', sans-serif;
      font-size: 48px;
      font-weight: 900;
      line-height: 1;
      color: #F0A500;
      min-width: 70px;
      flex-shrink: 0;
      padding-top: 4px;
    }

    .bullet-text {
      font-family: 'Inter', sans-serif;
      font-size: 26px;
      font-weight: 500;
      line-height: 1.5;
      color: rgba(220, 235, 255, 0.90);
      flex: 1;
      padding-top: 8px;
      word-break: break-word;
    }

    /* ── Decorative elements ── */
    .divider-line {
      position: absolute;
      bottom: 185px;
      left: 110px;
      right: 110px;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(240, 165, 0, 0.45), transparent);
      z-index: 2;
    }

    .dot-grid {
      position: absolute;
      bottom: 140px;
      right: 70px;
      display: grid;
      grid-template-columns: repeat(6, 6px);
      grid-template-rows: repeat(3, 6px);
      gap: 10px;
      opacity: 0.45;
      z-index: 2;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #F0A500;
    }

    .diamond-icon {
      position: absolute;
      bottom: 30px;
      right: 60px;
      color: rgba(240, 165, 0, 0.35);
      font-size: 28px;
      line-height: 1;
      z-index: 2;
    }

    /* ── Footer ── */
    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 80px 40px;
      text-align: center;
      z-index: 2;
    }

    .footer-name {
      font-family: 'Lexend', sans-serif;
      font-weight: 700;
      font-size: 28px;
      color: #FFFFFF;
      margin-bottom: 4px;
    }

    .footer-title {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 18px;
      color: rgba(180, 200, 230, 0.55);
    }

    .footer-postnum {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: rgba(120, 140, 180, 0.45);
      margin-top: 4px;
    }
  </style>
</head>
<body>
<div class="canvas">

  <!-- Main content area -->
  <div class="content-area">

    <!-- Hanging card -->
    <div class="card-wrapper">
      <div class="string string-left"></div>
      <div class="string string-right"></div>
      <div class="pin pin-left"></div>
      <div class="pin pin-right"></div>
      <div class="glass-card">
        <div class="daily-post-badge">DAILY POST</div>
        <div class="category-text">{{CATEGORY_LABEL}}</div>
        <div class="card-subtitle">Insights &amp; Progress from the Engineering Desk</div>
      </div>
    </div>

    <!-- Headline -->
    <h1 class="headline">{{HEADLINE}}</h1>

    <!-- Bullet points -->
    <div class="bullets">
      <div class="bullet">
        <span class="num">01</span>
        <span class="bullet-text">{{BULLET_1}}</span>
      </div>
      <div class="bullet">
        <span class="num">02</span>
        <span class="bullet-text">{{BULLET_2}}</span>
      </div>
      <div class="bullet">
        <span class="num">03</span>
        <span class="bullet-text">{{BULLET_3}}</span>
      </div>
      <div class="bullet" style="{{BULLET_4_STYLE}}">
        <span class="num">04</span>
        <span class="bullet-text">{{BULLET_4}}</span>
      </div>
      <div class="bullet" style="{{BULLET_5_STYLE}}">
        <span class="num">05</span>
        <span class="bullet-text">{{BULLET_5}}</span>
      </div>
    </div>

  </div>

  <!-- Divider line -->
  <div class="divider-line"></div>

  <!-- Dot grid 3x6 -->
  <div class="dot-grid">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <!-- Diamond accent -->
  <div class="diamond-icon">&#9670;</div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-name">{{NAME}}</div>
    <div class="footer-title">{{TITLE}}</div>
    <div class="footer-postnum">Post #{{POST_NUMBER}}</div>
  </div>

</div>
</body>
</html>
