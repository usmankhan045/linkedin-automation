<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=1080">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    [class*="gemini"], [class*="watermark"], [id*="watermark"],
    [class*="logo"]:not(.our-logo), iframe,
    [class*="attribution"] { display: none !important; }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    .canvas {
      width: 1080px;
      height: 1350px;
      position: relative;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      padding: 60px 80px 56px;
    }

    /* ── Top badge ───────────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 52px;
      flex-shrink: 0;
    }

    .badge-icon-wrap {
      width: 42px;
      height: 42px;
      background: #0A7CFF;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .badge-icon {
      width: 22px;
      height: 22px;
      color: #FFFFFF;
    }

    .badge-label {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #0A2540;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* ── Main heading ────────────────────────────────────────────── */
    .heading-block {
      flex-shrink: 0;
      margin-bottom: 44px;
    }

    .heading-hook {
      font-family: 'Inter', sans-serif;
      font-size: 92px;
      font-weight: 900;
      color: #0A2540;
      line-height: 1.0;
      letter-spacing: -0.03em;
      display: block;
    }

    .heading-headline {
      font-family: 'Inter', sans-serif;
      font-size: 92px;
      font-weight: 900;
      color: #0A7CFF;
      line-height: 1.0;
      letter-spacing: -0.03em;
      display: block;
    }

    /* ── Section label ───────────────────────────────────────────── */
    .section-label {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #A0B0C4;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 28px;
      flex-shrink: 0;
    }

    /* ── Bullet cards ────────────────────────────────────────────── */
    .bullets {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .bullet {
      display: flex;
      align-items: center;
      gap: 24px;
      background: #FFFFFF;
      border: 1.5px solid #E8EFF7;
      border-radius: 14px;
      padding: 22px 28px;
      box-shadow: 0 2px 12px rgba(10, 37, 64, 0.05);
    }

    .step-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #0A7CFF;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-num {
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 0.04em;
    }

    .bullet-text {
      font-family: 'Inter', sans-serif;
      font-size: 27px;
      font-weight: 700;
      color: #0A2540;
      line-height: 1.35;
      flex: 1;
    }

    /* ── Footer ──────────────────────────────────────────────────── */
    .footer {
      margin-top: 36px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-shrink: 0;
    }

    .avatar {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }

    .footer-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .footer-name {
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #0A2540;
    }

    .footer-title {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: #8FA5BE;
    }

    .footer-postnum {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #0A7CFF;
      margin-top: 2px;
    }
  </style>
</head>
<body>
<div class="canvas">

  <!-- Badge -->
  <div>
    <div class="badge">
      <div class="badge-icon-wrap">
        <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      </div>
      <span class="badge-label">{{CATEGORY_LABEL}}</span>
    </div>
  </div>

  <!-- Heading: hook (dark) + headline (blue) -->
  <div class="heading-block">
    <span class="heading-hook">{{HOOK}}</span>
    <span class="heading-headline">{{HEADLINE}}</span>
  </div>

  <!-- Section label -->
  <div class="section-label">The Playbook</div>

  <!-- Bullet cards -->
  <div class="bullets">

    <div class="bullet">
      <div class="step-circle"><span class="step-num">01</span></div>
      <span class="bullet-text">{{BULLET_1}}</span>
    </div>

    <div class="bullet">
      <div class="step-circle"><span class="step-num">02</span></div>
      <span class="bullet-text">{{BULLET_2}}</span>
    </div>

    <div class="bullet">
      <div class="step-circle"><span class="step-num">03</span></div>
      <span class="bullet-text">{{BULLET_3}}</span>
    </div>

    <div class="bullet" style="{{BULLET_4_STYLE}}">
      <div class="step-circle"><span class="step-num">04</span></div>
      <span class="bullet-text">{{BULLET_4}}</span>
    </div>

    <div class="bullet" style="{{BULLET_5_STYLE}}">
      <div class="step-circle"><span class="step-num">05</span></div>
      <span class="bullet-text">{{BULLET_5}}</span>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <svg class="avatar" viewBox="0 0 52 52" fill="none">
      <circle cx="26" cy="52" r="22" fill="#E0EAF5"/>
      <circle cx="26" cy="18" r="10" fill="#B4C8DC"/>
    </svg>
    <div class="footer-info">
      <div class="footer-name">Muhammad Usman</div>
      <div class="footer-title">{{TITLE}}</div>
      <div class="footer-postnum">Post #{{POST_NUMBER}}</div>
    </div>
  </div>

</div>
</body>
</html>
