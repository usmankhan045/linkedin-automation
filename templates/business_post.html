<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=1080">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Block any external attribution marks */
    [class*="gemini"],
    [class*="watermark"],
    [id*="watermark"],
    [class*="logo"]:not(.our-logo),
    iframe,
    [class*="attribution"] {
      display: none !important;
    }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
    }

    /* ── Consultant Slide Theme: Pure White, Dark Bold, Outcome-First ── */
    .canvas {
      width: 1080px;
      height: 1350px;
      position: relative;
      display: flex;
      flex-direction: column;
      background: #FFFFFF;
    }

    /* Top accent bar — dark navy */
    .top-bar {
      width: 100%;
      height: 16px;
      background: #0A2540;
      flex-shrink: 0;
    }

    /* Main content area */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 56px 90px 0;
      position: relative;
    }

    /* Category badge — minimal tag */
    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
    }

    .badge-bar {
      width: 6px;
      height: 30px;
      background: #0A7CFF;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .badge-label {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #0A2540;
    }

    /* Outcome headline — the BIGGEST element on the slide */
    .headline {
      font-family: 'Lexend', sans-serif;
      font-size: 76px;
      font-weight: 900;
      color: #0A2540;
      line-height: 1.08;
      margin-bottom: 48px;
      max-width: 880px;
    }

    /* Section label above the steps */
    .section-label {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: #0A7CFF;
      margin-bottom: 30px;
    }

    /* Step bullets — clean numbered list */
    .bullets {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .bullet {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 28px;
      padding: 24px 0;
      border-bottom: 1px solid #E8EDF2;
    }

    .bullet:first-child {
      border-top: 1px solid #E8EDF2;
    }

    .step-num {
      font-family: 'Lexend', sans-serif;
      font-size: 42px;
      font-weight: 900;
      color: #0A7CFF;
      line-height: 1;
      min-width: 60px;
      flex-shrink: 0;
      padding-top: 4px;
    }

    .bullet-text {
      font-family: 'Inter', sans-serif;
      font-size: 27px;
      font-weight: 500;
      line-height: 1.45;
      color: #1A1A2E;
      flex: 1;
      padding-top: 4px;
      word-break: break-word;
    }

    /* Bottom divider */
    .bottom-divider {
      position: absolute;
      bottom: 128px;
      left: 90px;
      right: 90px;
      height: 2px;
      background: #E8EDF2;
    }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0 90px 0;
      height: 128px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-left {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .footer-name {
      font-family: 'Lexend', sans-serif;
      font-weight: 700;
      font-size: 24px;
      color: #0A2540;
    }

    .footer-title {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 16px;
      color: #5A6A7E;
    }

    .footer-postnum {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #AAB4BE;
    }

    /* Bottom accent bar — gradient */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: linear-gradient(to right, #0A2540, #0A7CFF);
    }
  </style>
</head>
<body>
<div class="canvas">

  <!-- Top accent bar -->
  <div class="top-bar"></div>

  <!-- Main content -->
  <div class="content-area">

    <!-- Category badge -->
    <div class="category-badge">
      <div class="badge-bar"></div>
      <span class="badge-label">{{CATEGORY_LABEL}}</span>
    </div>

    <!-- Outcome headline — dominant element -->
    <h1 class="headline">{{HEADLINE}}</h1>

    <!-- Steps section label -->
    <div class="section-label">The Playbook</div>

    <!-- Numbered steps -->
    <div class="bullets">
      <div class="bullet">
        <span class="step-num">01</span>
        <span class="bullet-text">{{BULLET_1}}</span>
      </div>
      <div class="bullet">
        <span class="step-num">02</span>
        <span class="bullet-text">{{BULLET_2}}</span>
      </div>
      <div class="bullet">
        <span class="step-num">03</span>
        <span class="bullet-text">{{BULLET_3}}</span>
      </div>
      <div class="bullet" style="{{BULLET_4_STYLE}}">
        <span class="step-num">04</span>
        <span class="bullet-text">{{BULLET_4}}</span>
      </div>
      <div class="bullet" style="{{BULLET_5_STYLE}}">
        <span class="step-num">05</span>
        <span class="bullet-text">{{BULLET_5}}</span>
      </div>
    </div>

  </div>

  <!-- Bottom divider -->
  <div class="bottom-divider"></div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-left">
      <div class="footer-name">{{NAME}}</div>
      <div class="footer-title">{{TITLE}}</div>
      <div class="footer-postnum">Post #{{POST_NUMBER}}</div>
    </div>
  </div>

  <!-- Bottom accent bar -->
  <div class="bottom-bar"></div>

</div>
</body>
</html>
