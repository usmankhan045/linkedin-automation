name: Comment Triage

on:
  schedule:
    # Every 2 hours, Mon–Fri, 9 AM to 7 PM PKT (4 AM to 2 PM UTC)
    - cron: '0 4  * * 1-5'   # 09:00 PKT
    - cron: '0 6  * * 1-5'   # 11:00 PKT
    - cron: '0 8  * * 1-5'   # 13:00 PKT
    - cron: '0 10 * * 1-5'   # 15:00 PKT
    - cron: '0 12 * * 1-5'   # 17:00 PKT
    - cron: '0 14 * * 1-5'   # 19:00 PKT
  workflow_dispatch:

env:
  GROQ_API_KEY:                    ${{ secrets.GROQ_API_KEY }}
  GROQ_MODEL:                      ${{ secrets.GROQ_MODEL }}
  LINKEDIN_ACCESS_TOKEN:           ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
  LINKEDIN_REFRESH_TOKEN:          ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
  LINKEDIN_CLIENT_ID:              ${{ secrets.LINKEDIN_CLIENT_ID }}
  LINKEDIN_CLIENT_SECRET:          ${{ secrets.LINKEDIN_CLIENT_SECRET }}
  SUPABASE_URL:                    ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY:       ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GOOGLE_SHEETS_SPREADSHEET_ID:    ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
  GOOGLE_SERVICE_ACCOUNT_JSON:     ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  DISCORD_BOT_TOKEN:               ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_LEADS_CHANNEL_ID:        ${{ secrets.DISCORD_LEADS_CHANNEL_ID }}
  DISCORD_CONFIRMATIONS_CHANNEL_ID: ${{ secrets.DISCORD_CONFIRMATIONS_CHANNEL_ID }}
  SHEETS_CONTENT_BACKLOG_TAB:      ${{ secrets.SHEETS_CONTENT_BACKLOG_TAB }}

jobs:
  triage:
    name: Fetch and classify LinkedIn comments
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run comment triage
        run: python tools/triage_comments.py

      - name: Report failure
        if: failure()
        run: |
          echo "Comment triage failed."
          echo "Common causes: LinkedIn API 403 (limited access), token expired, Groq unavailable."
