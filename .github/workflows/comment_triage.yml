name: Comment Triage

on:
  workflow_dispatch:        # Manual trigger only — schedule paused

env:
  GROQ_API_KEY:                    ${{ secrets.GROQ_API_KEY }}
  GROQ_MODEL:                      ${{ secrets.GROQ_MODEL }}
  LINKEDIN_ACCESS_TOKEN:           ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
  LINKEDIN_REFRESH_TOKEN:          ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
  LINKEDIN_CLIENT_ID:              ${{ secrets.LINKEDIN_CLIENT_ID }}
  LINKEDIN_CLIENT_SECRET:          ${{ secrets.LINKEDIN_CLIENT_SECRET }}
  SUPABASE_URL:                    ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY:       ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GOOGLE_SHEETS_SPREADSHEET_ID:    ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
  GOOGLE_SERVICE_ACCOUNT_JSON:     ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  DISCORD_LEADS_WEBHOOK_URL:       ${{ secrets.DISCORD_LEADS_WEBHOOK_URL }}
  DISCORD_WEBHOOK_CONFIRMATIONS:   ${{ secrets.DISCORD_WEBHOOK_CONFIRMATIONS }}
  SHEETS_CONTENT_BACKLOG_TAB:      ${{ secrets.SHEETS_CONTENT_BACKLOG_TAB }}

jobs:
  triage:
    name: Fetch and classify LinkedIn comments
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run comment triage
        run: python tools/triage_comments.py

      - name: Report failure
        if: failure()
        run: |
          echo "Comment triage failed."
          echo "Common causes: LinkedIn API 403 (limited access), token expired, Groq unavailable."
