name: LinkedIn Daily Post

on:
  # Mon/Wed/Fri at 9 AM PKT (04:00 UTC)
  schedule:
    - cron: '0 4 * * 1'   # Monday    — technical
    - cron: '0 4 * * 2'   # Tuesday   — business
    - cron: '0 4 * * 3'   # Wednesday — technical
    - cron: '0 4 * * 4'   # Thursday  — business
    - cron: '0 4 * * 5'   # Friday    — technical
    - cron: '0 5 * * 6'   # Saturday  — story (10 AM PKT)
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      audience:
        description: 'Audience type (technical / business / story)'
        required: true
        default: 'technical'
        type: choice
        options:
          - technical
          - business
          - story

env:
  ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
  LINKEDIN_ACCESS_TOKEN:     ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
  LINKEDIN_REFRESH_TOKEN:    ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
  LINKEDIN_CLIENT_ID:        ${{ secrets.LINKEDIN_CLIENT_ID }}
  LINKEDIN_CLIENT_SECRET:    ${{ secrets.LINKEDIN_CLIENT_SECRET }}
  LINKEDIN_PERSON_URN:       ${{ secrets.LINKEDIN_PERSON_URN }}
  SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  DISCORD_BOT_TOKEN:         ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_STORIES_CHANNEL_ID: ${{ secrets.DISCORD_STORIES_CHANNEL_ID }}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Determine audience from schedule or manual input ──────────────────
      - name: Determine audience type
        id: audience
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            AUDIENCE="${{ github.event.inputs.audience }}"
          else
            DAY=$(date +%u)   # 1=Mon … 7=Sun
            case $DAY in
              1|3|5) AUDIENCE="technical" ;;
              2|4)   AUDIENCE="business" ;;
              6)     AUDIENCE="story" ;;
              *)     echo "No post scheduled today (Sunday)."; exit 0 ;;
            esac
          fi
          echo "audience=$AUDIENCE" >> $GITHUB_OUTPUT
          echo "Audience: $AUDIENCE"

      # ── Saturday only: ingest story from Discord ──────────────────────────
      - name: Ingest story from Discord
        id: ingest
        if: steps.audience.outputs.audience == 'story'
        run: |
          STORY_ID=$(python tools/discord_ingest.py)
          if [ -z "$STORY_ID" ]; then
            echo "No story available. Skipping Saturday post."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "story_id=$STORY_ID" >> $GITHUB_OUTPUT
          fi

      - name: Skip if no story
        if: steps.audience.outputs.audience == 'story' && steps.ingest.outputs.skip == 'true'
        run: echo "No story submitted this week. Skipping." && exit 0

      # ── Generate post content ─────────────────────────────────────────────
      - name: Generate post
        id: generate
        run: |
          AUDIENCE="${{ steps.audience.outputs.audience }}"
          if [ "$AUDIENCE" = "story" ] && [ -n "${{ steps.ingest.outputs.story_id }}" ]; then
            POST_ID=$(python tools/generate_post.py --audience "$AUDIENCE" --story_id "${{ steps.ingest.outputs.story_id }}")
          else
            POST_ID=$(python tools/generate_post.py --audience "$AUDIENCE")
          fi
          echo "post_id=$POST_ID" >> $GITHUB_OUTPUT
          echo "Generated post ID: $POST_ID"

      # ── Generate and upload image ─────────────────────────────────────────
      - name: Generate image
        id: image
        run: |
          python tools/generate_image.py --post_id "${{ steps.generate.outputs.post_id }}"

      # ── Publish to LinkedIn ───────────────────────────────────────────────
      - name: Publish to LinkedIn
        run: |
          python tools/publish_linkedin.py --post_id "${{ steps.generate.outputs.post_id }}"

      # ── On failure: surface the post_id for easy debugging ────────────────
      - name: Report failure
        if: failure()
        run: |
          echo "Pipeline failed. Post ID: ${{ steps.generate.outputs.post_id }}"
          echo "Check Supabase posts table for error_message."
