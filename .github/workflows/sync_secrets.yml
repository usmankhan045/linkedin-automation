name: Sync Secrets to Droplet

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Which secret to sync (e.g. GROQ_API_KEY)'
        required: true
        type: choice
        options:
          - GROQ_API_KEY
          - GEMINI_API_KEY
          - LINKEDIN_ACCESS_TOKEN
          - DISCORD_BOT_TOKEN
          - DISCORD_READY_POSTS_CHANNEL_ID
          - DISCORD_STORIES_CHANNEL_ID
          - DISCORD_GHOSTWRITER_CHANNEL_ID
          - DISCORD_CONFIRMATIONS_CHANNEL_ID
          - DISCORD_COMMANDS_CHANNEL_ID
          - SUPABASE_URL
          - SUPABASE_SERVICE_ROLE_KEY
          - GOOGLE_SHEETS_SPREADSHEET_ID
          - ANTHROPIC_API_KEY
          - OPENAI_API_KEY
          - APIFY_API_TOKEN
          - ALL

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync selected secret to droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            ENV_FILE=~/linkedin-automation/.env

            update_key() {
              KEY=$1
              VALUE=$2
              if grep -q "^${KEY}=" "$ENV_FILE"; then
                sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" "$ENV_FILE"
              else
                echo "${KEY}=${VALUE}" >> "$ENV_FILE"
              fi
              echo "Updated: ${KEY}"
            }

            SELECTED="${{ github.event.inputs.secret_name }}"

            if [ "$SELECTED" = "ALL" ] || [ "$SELECTED" = "GROQ_API_KEY" ]; then
              update_key "GROQ_API_KEY" "${{ secrets.GROQ_API_KEY }}"
            fi
            if [ "$SELECTED" = "ALL" ] || [ "$SELECTED" = "GEMINI_API_KEY" ]; then
              update_key "GEMINI_API_KEY" "${{ secrets.GEMINI_API_KEY }}"
            fi
            if [ "$SELECTED" = "ALL" ] || [ "$SELECTED" = "LINKEDIN_ACCESS_TOKEN" ]; then
              update_key "LINKEDIN_ACCESS_TOKEN" "${{ secrets.LINKEDIN_ACCESS_TOKEN }}"
            fi
            if [ "$SELECTED" = "ALL" ] || [ "$SELECTED" = "DISCORD_BOT_TOKEN" ]; then
              update_key "DISCORD_BOT_TOKEN" "${{ secrets.DISCORD_BOT_TOKEN }}"
            fi
            if [ "$SELECTED" = "ALL" ] || [ "$SELECTED" = "DISCORD_READY_POSTS_CHANNEL_ID" ]; then
              update_key "DISCORD_READY_POSTS_CHANNEL_ID" "${{ secrets.DISCORD_READY_POSTS_CHANNEL_ID }}"
            fi
            if [ "$SELECTED" = "ALL" ] || [ "$SELECTED" = "DISCORD_STORIES_CHANNEL_ID" ]; then
              update_key "DISCORD_STORIES_CHANNEL_ID" "${{ secrets.DISCORD_STORIES_CHANNEL_ID }}"
            fi
            if [ "$SELECTED" = "ALL" ] || [ "$SELECTED" = "DISCORD_GHOSTWRITER_CHANNEL_ID" ]; then
              update_key "DISCORD_GHOSTWRITER_CHANNEL_ID" "${{ secrets.DISCORD_GHOSTWRITER_CHANNEL_ID }}"
            fi
            if [ "$SELECTED" = "ALL" ] || [ "$SELECTED" = "DISCORD_CONFIRMATIONS_CHANNEL_ID" ]; then
              update_key "DISCORD_CONFIRMATIONS_CHANNEL_ID" "${{ secrets.DISCORD_CONFIRMATIONS_CHANNEL_ID }}"
            fi
            if [ "$SELECTED" = "ALL" ] || [ "$SELECTED" = "DISCORD_COMMANDS_CHANNEL_ID" ]; then
              update_key "DISCORD_COMMANDS_CHANNEL_ID" "${{ secrets.DISCORD_COMMANDS_CHANNEL_ID }}"
            fi
            if [ "$SELECTED" = "ALL" ] || [ "$SELECTED" = "SUPABASE_URL" ]; then
              update_key "SUPABASE_URL" "${{ secrets.SUPABASE_URL }}"
            fi
            if [ "$SELECTED" = "ALL" ] || [ "$SELECTED" = "SUPABASE_SERVICE_ROLE_KEY" ]; then
              update_key "SUPABASE_SERVICE_ROLE_KEY" "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            fi
            if [ "$SELECTED" = "ALL" ] || [ "$SELECTED" = "GOOGLE_SHEETS_SPREADSHEET_ID" ]; then
              update_key "GOOGLE_SHEETS_SPREADSHEET_ID" "${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}"
            fi
            if [ "$SELECTED" = "ALL" ] || [ "$SELECTED" = "ANTHROPIC_API_KEY" ]; then
              update_key "ANTHROPIC_API_KEY" "${{ secrets.ANTHROPIC_API_KEY }}"
            fi
            if [ "$SELECTED" = "ALL" ] || [ "$SELECTED" = "OPENAI_API_KEY" ]; then
              update_key "OPENAI_API_KEY" "${{ secrets.OPENAI_API_KEY }}"
            fi
            if [ "$SELECTED" = "ALL" ] || [ "$SELECTED" = "APIFY_API_TOKEN" ]; then
              update_key "APIFY_API_TOKEN" "${{ secrets.APIFY_API_TOKEN }}"
            fi

            cd ~/linkedin-automation
            pm2 restart all
            echo "PM2 restarted — secrets synced at $(date)"
